name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Windows x86)
    runs-on: windows-latest
    env:
      # 32-bit testhost must resolve x86 hostfxr / shared frameworks.
      "DOTNET_ROOT(x86)": C:\Program Files (x86)\dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (x64 SDK)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # setup-dotnet architecture=x86 can skip some shared frameworks (seen: no 9.x x86).
      # Install Microsoft.NETCore.App x86 explicitly for every TFM under test.
      - name: Install .NET x86 shared frameworks
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $script
          $installDir = Join-Path ${env:ProgramFiles(x86)} "dotnet"
          foreach ($channel in @("8.0", "9.0", "10.0")) {
            Write-Host "Installing Microsoft.NETCore.App $channel (x86) -> $installDir"
            # Exit code is unreliable when the runtime is already present; verify folders below.
            & $script -Channel $channel -Architecture x86 -Runtime dotnet -InstallDir $installDir | Write-Host
          }
          $shared = Join-Path $installDir "shared\Microsoft.NETCore.App"
          if (-not (Test-Path $shared)) { throw "Missing $shared after install" }
          Write-Host "Installed x86 frameworks:"
          Get-ChildItem $shared | ForEach-Object { Write-Host " - $($_.Name)" }
          foreach ($prefix in @("8.", "9.", "10.")) {
            $found = @(Get-ChildItem $shared -Directory | Where-Object { $_.Name.StartsWith($prefix) })
            if ($found.Count -eq 0) { throw "Missing x86 Microsoft.NETCore.App $prefix*" }
          }

      - name: Restore
        run: dotnet restore ThinBasic.NET.sln

      - name: Build
        run: dotnet build ThinBasic.NET.sln -c Release -p:Platform=x86 --no-restore

      - name: Test (net8 / net9 / net10)
        run: >
          dotnet test ThinBasic.NETTests/ThinBasic.NETTests.csproj
          -c Release
          -p:Platform=x86
          --no-build
          --verbosity normal

      - name: Pack
        run: >
          dotnet pack ThinBasic.NET/ThinBasic.NET.csproj
          -c Release
          -p:Platform=x86
          --no-build
          --output "${{ github.workspace }}/artifacts"

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
          if-no-files-found: error
