name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Windows x86)
    runs-on: windows-latest
    env:
      # 32-bit testhost must resolve x86 hostfxr; architecture-less DOTNET_ROOT
      # pointing at x64 causes HRESULT 0x800700C1 (ERROR_BAD_EXE_FORMAT).
      "DOTNET_ROOT(x86)": C:\Program Files (x86)\dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # architecture= requires setup-dotnet v6+. Install x86 first; x64 setup
      # afterward keeps the `dotnet` CLI on PATH as x64.
      - name: Setup .NET (x86)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          architecture: x86

      - name: Setup .NET (x64)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          architecture: x64

      - name: Verify x86 hostfxr
        shell: pwsh
        run: |
          $fxr = Join-Path ${env:ProgramFiles(x86)} "dotnet\host\fxr"
          if (-not (Test-Path $fxr)) { throw "Missing x86 hostfxr directory: $fxr" }
          Get-ChildItem $fxr | ForEach-Object { $_.FullName }
          $dll = Get-ChildItem $fxr -Recurse -Filter hostfxr.dll | Select-Object -First 1
          if (-not $dll) { throw "hostfxr.dll not found under $fxr" }
          Write-Host "Using $($dll.FullName)"

      - name: Restore
        run: dotnet restore ThinBasic.NET.sln

      # Solution Release|x86 must map tests to Platform=x86 so outputs land in bin/x86/Release.
      - name: Build
        run: dotnet build ThinBasic.NET.sln -c Release -p:Platform=x86 --no-restore

      - name: Test (net8 / net9 / net10)
        run: >
          dotnet test ThinBasic.NETTests/ThinBasic.NETTests.csproj
          -c Release
          -p:Platform=x86
          --no-build
          --verbosity normal

      - name: Pack
        run: >
          dotnet pack ThinBasic.NET/ThinBasic.NET.csproj
          -c Release
          -p:Platform=x86
          --no-build
          --output "${{ github.workspace }}/artifacts"

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
          if-no-files-found: error
